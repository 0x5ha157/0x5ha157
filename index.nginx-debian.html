<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Module Launcher</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --success-color: #2ea44f;
            --error-color: #f85149;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .services-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, transform 0.2s;
        }

        .service-item:hover {
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        .service-name {
            font-family: monospace;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .service-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-family: monospace;
            font-size: 0.75rem;
            border: 1px solid var(--success-color);
            color: var(--success-color);
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .status-message {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 16px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>System Modules</h1>
        <div class="subtitle">> Dynamic deployment environment console</div>

        <!-- The dynamic modules will inject directly here -->
        <div class="services-grid" id="dynamic-module-container">
            <div class="status-message">> Querying GitHub repository tree...</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Change these to match your GitHub repository info
        const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME"; 
        const REPO_NAME = "YOUR_REPO_NAME";
        const BRANCH = "main"; // default branch (usually 'main' or 'master')

        // System directories or files you want to hide from the launcher list
        const EXCLUDE_LIST = ['.github', '.vercel', 'node_modules', 'assets', 'css', 'js'];

        async function fetchDynamicModules() {
            const container = document.getElementById('dynamic-module-container');
            
            // Fallback validation if config isn't set up yet
            if (GITHUB_USERNAME === "YOUR_GITHUB_USERNAME") {
                container.innerHTML = `<div class="status-message" style="color: var(--error-color)">[ERROR] Please update GITHUB_USERNAME and REPO_NAME variables inside the script tag.</div>`;
                return;
            }

            try {
                // Fetch the root contents of the repo via GitHub's public API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents?ref=${BRANCH}`);
                
                if (!response.ok) {
                    throw new Error(`GitHub API returned status: ${response.status}`);
                }
                
                const items = await response.json();

                // Filter out everything that isn't a directory, index.html itself, or excluded items
                const directories = items.filter(item => 
                    item.type === 'dir' && 
                    !EXCLUDE_LIST.includes(item.name)
                );

                if (directories.length === 0) {
                    container.innerHTML = `<div class="status-message">> No standalone application modules found in the root directory.</div>`;
                    return;
                }

                // Clear the loading message
                container.innerHTML = '';

                // Generate cards dynamically for each folder found
                directories.forEach(dir => {
                    const cleanLabel = `./${dir.name.toUpperCase().replace(/[-_]/g, '_')}.sh`;
                    
                    const anchor = document.createElement('a');
                    anchor.href = `./${dir.name}/`; // Links directly to the subfolder route on Vercel
                    anchor.className = 'service-item';
                    anchor.innerHTML = `
                        <div>
                            <div class="service-name">${cleanLabel}</div>
                            <div class="service-desc">Routed app configuration mounted at /${dir.name}</div>
                        </div>
                        <div class="status-badge">[ MOUNTED ]</div>
                    `;
                    container.appendChild(anchor);
                });

            } catch (error) {
                console.error("Failed to sync repo tree:", error);
                container.innerHTML = `<div class="status-message" style="color: var(--error-color)">[ERROR] Failed to stream repository tree data from GitHub pipeline.</div>`;
            }
        }

        // Initialize on page load
        fetchDynamicModules();
    </script>
</body>
</html>
