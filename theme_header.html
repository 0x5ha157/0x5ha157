<!DOCTYPE html>
<html>
<head>
<title>root@0x5ha157:~/blogs</title>
<style>
    :root {
        --bg-color: #0d1117;
        --text-color: #c9d1d9;
        --accent-color: #58a6ff;
        --cmd-color: #7ee787;
        --dim-color: #8b949e;
        --font-stack: 'Consolas', 'Monaco', 'Andale Mono', monospace;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-stack);
        margin: 0;
        padding: 2rem;
        font-size: 1rem;
    }

    /* Hide the default Nginx Title and Separator */
    h1, hr { display: none; }

    /* Style the file list container */
    pre {
        font-family: var(--font-stack);
        color: var(--text-color);
        margin-top: 20px;
        line-height: 1.5;
    }

    /* Style the Links (Files/Folders) */
    a {
        color: var(--text-color);
        text-decoration: none;
    }

    a:hover {
        color: var(--accent-color);
        text-decoration: underline;
    }

    /* Make the directory link blue */
    a[href="../"] { color: var(--accent-color); font-weight: bold; }

    /* The Terminal Prompt Header */
    .terminal-header { margin-bottom: 10px; }
    .prompt { color: var(--cmd-color); font-weight: bold; }
    .path { color: var(--accent-color); }
    .command { color: #fff; }

    /* Fake Column Headers */
    .col-header {
        color: var(--dim-color);
        font-weight: bold;
        border-bottom: 1px solid #30363d;
        padding-bottom: 5px;
        margin-bottom: 10px;
        display: block;
        width: fit-content;
    }
</style>
</head>
<body>

<div class="terminal-header">
    <span class="prompt">root@0x5ha157</span>:<span class="path">~/blogs</span>$ <span class="command">ls -lah</span>
</div>

<div class="col-header">
    <span style="display:inline-block; width: 50px;">Mode</span>
    <span style="display:inline-block; width: 140px;">Last Modified</span>
    <span style="display:inline-block; width: 80px;">Size</span>
    <span>Name</span>
</div>
